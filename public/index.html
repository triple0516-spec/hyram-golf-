<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HYRAM GOLF 회원 서비스</title><style>
:root{color-scheme:dark;--bg:#0b0d0c;--panel:#171b19;--line:#39423b;--text:#f1f2ed;--muted:#a8b2a8;--olive:#667653}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at 85% 0%,#273126 0%,transparent 42%),var(--bg);color:var(--text);margin:0;min-height:100vh}
main{max-width:520px;margin:5vh auto;padding:clamp(24px,5vw,44px);background:linear-gradient(150deg,#1b211d,#121614);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px #0008}
.brand{font-size:12px;letter-spacing:.3em;color:#a4b396;font-weight:700}.eyebrow{font-size:11px;letter-spacing:.18em;color:#9daa8f;margin-top:6px}h1{font-size:clamp(32px,7vw,44px);letter-spacing:.09em;margin:18px 0 4px}h2{font-size:19px;letter-spacing:.04em}p{color:var(--muted);line-height:1.6}label{display:block;margin-top:18px;font-weight:600;font-size:14px}input{display:block;width:100%;padding:14px;margin-top:8px;border:1px solid #48534a;background:#0e120f;color:var(--text);border-radius:7px;font:inherit}input:focus{outline:2px solid #a5b990;outline-offset:2px}button{width:100%;padding:14px 18px;border:1px solid #839575;background:var(--olive);color:#fff;border-radius:7px;margin-top:18px;cursor:pointer;font-weight:700;letter-spacing:.04em}button:hover{filter:brightness(1.15)}button.secondary{background:transparent;color:#c5d0be;border-color:#495649}button:focus-visible{outline:2px solid #d0dfbf;outline-offset:3px}#message{min-height:24px;color:#d5dfcc}small{display:block;color:#aeb9aa;line-height:1.6;margin-top:14px}section{border-top:1px solid var(--line);margin-top:24px;padding-top:12px}[hidden]{display:none!important}@media(max-width:560px){main{margin:16px;padding:25px;border-radius:12px}}
</style></head><body><main><div class="brand">HYRAM / PERFORMANCE DIVISION</div><h1>HYRAM GOLF</h1><div class="eyebrow">PRECISION · POWER · CONTROL</div><p>정교한 기준으로 완성하는 골프 퍼포먼스<br>회원가입 및 로그인</p><div id="guest"><form id="auth"><label>이메일<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><div id="name-field" hidden><label>이름<input name="name" autocomplete="name" maxlength="80"></label></div><button type="submit" id="submit">로그인</button><button type="button" class="secondary" id="switch">회원가입으로 전환</button></form><small>비밀번호는 12자 이상 입력해 주세요.</small></div><div id="member" hidden><p id="welcome"></p><section id="business"><h2>사업자몰 신청</h2><p id="business-status">사업자 회원 여부 확인 중</p><form id="business-form" hidden><label>상호명<input name="company_name" required maxlength="120"></label><label>대표자명<input name="representative_name" required maxlength="80"></label><button type="submit">사업자 회원 심사 신청</button></form><small>사업자 정보는 승인 심사에만 사용하며, 신청 후 관리자 검토가 필요합니다.</small></section><button id="logout">로그아웃</button></div><p id="message" role="status" aria-live="polite"></p></main><script>let registering=false;const $=id=>document.getElementById(id),msg=t=>$("message").textContent=t;$("switch").onclick=()=>{registering=!registering;$("name-field").hidden=!registering;$("submit").textContent=registering?"회원가입":"로그인";$("switch").textContent=registering?"로그인으로 전환":"회원가입으로 전환";$("auth").elements.name.required=registering;msg("")};async function api(path,body){const r=await fetch("/api/auth/"+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body),credentials:"same-origin"});const data=await r.json();if(!r.ok)throw Error(data.error||"요청 실패");return data;}async function refreshBusiness(){const r=await fetch("/api/business/me",{credentials:"same-origin"});if(!r.ok){$("business-status").textContent="사업자 회원 정보를 불러오지 못했습니다.";return}const {application}=await r.json();$("business-form").hidden=!!application;$("business-status").textContent=application?("사업자 심사 상태: "+({pending:"심사 대기",approved:"승인",rejected:"반려"}[application.status]||"확인 필요")):"사업자 회원 심사를 신청할 수 있습니다.";} $("business-form").onsubmit=async e=>{e.preventDefault();try{const r=await fetch("/api/business/apply",{method:"POST",headers:{"content-type":"application/json"},credentials:"same-origin",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const data=await r.json();if(!r.ok)throw Error(data.error||"신청 실패");msg("사업자 회원 신청이 접수되었습니다.");await refreshBusiness()}catch(err){msg(err.message)}};async function refresh(){const r=await fetch("/api/auth/me",{credentials:"same-origin"});if(!r.ok)return;const {user}=await r.json();$("guest").hidden=true;$("member").hidden=false;$("welcome").textContent=user.name+"님, 환영합니다.";await refreshBusiness();} $("auth").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api(registering?"register":"login",Object.fromEntries(f));if(registering){msg("가입이 완료되었습니다. 로그인해 주세요.");$("switch").click()}else{msg("로그인되었습니다.");await refresh()}}catch(err){msg(err.message)}};$("logout").onclick=async()=>{try{await api("logout",{});location.reload()}catch(err){msg(err.message)}};refresh();</script></body></html>
