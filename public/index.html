<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HYRAM GOLF 회원 서비스</title><style>body{font-family:system-ui,sans-serif;background:#f5f7f5;color:#173329;margin:0}main{max-width:460px;margin:6vh auto;padding:28px;background:white;border-radius:18px;box-shadow:0 5px 24px #0001}h1{font-size:28px}label{display:block;margin-top:15px;font-weight:600}input{width:100%;box-sizing:border-box;padding:13px;margin-top:6px;border:1px solid #aab7b0;border-radius:8px}button{padding:12px 18px;border:0;background:#145c43;color:white;border-radius:8px;margin-top:18px;cursor:pointer}button.secondary{background:#e3ece7;color:#173329}#message{min-height:24px}small{color:#596b60}</style></head><body><main><h1>HYRAM GOLF</h1><p>회원가입 및 로그인</p><div id="guest"><form id="auth"><label>이메일<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><div id="name-field" hidden><label>이름<input name="name" autocomplete="name" maxlength="80"></label></div><button type="submit" id="submit">로그인</button><button type="button" class="secondary" id="switch">회원가입으로 전환</button></form><small>비밀번호는 12자 이상 입력해 주세요.</small></div><div id="member" hidden><p id="welcome"></p><button id="logout">로그아웃</button></div><p id="message" role="status" aria-live="polite"></p></main><script>let registering=false;const $=id=>document.getElementById(id),msg=t=>$("message").textContent=t;$("switch").onclick=()=>{registering=!registering;$("name-field").hidden=!registering;$("submit").textContent=registering?"회원가입":"로그인";$("switch").textContent=registering?"로그인으로 전환":"회원가입으로 전환";$("auth").elements.name.required=registering;msg("")};async function api(path,body){const r=await fetch("/api/auth/"+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body),credentials:"same-origin"});const data=await r.json();if(!r.ok)throw Error(data.error||"요청 실패");return data;}async function refresh(){const r=await fetch("/api/auth/me",{credentials:"same-origin"});if(!r.ok)return;const {user}=await r.json();$("guest").hidden=true;$("member").hidden=false;$("welcome").textContent=user.name+"님, 환영합니다.";} $("auth").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api(registering?"register":"login",Object.fromEntries(f));if(registering){msg("가입이 완료되었습니다. 로그인해 주세요.");$("switch").click()}else{msg("로그인되었습니다.");await refresh()}}catch(err){msg(err.message)}};$("logout").onclick=async()=>{try{await api("logout",{});location.reload()}catch(err){msg(err.message)}};refresh();</script></body></html>
